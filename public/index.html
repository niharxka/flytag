<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>FlyTag · Rides to SAN with UCSD classmates</title>
    <meta name="description" content="Share rides to and from San Diego airport with fellow UCSD students. Split the fare and chat with your ride." />
    <meta name="theme-color" content="#2f5a77" />

    <!-- Link previews (iMessage, WhatsApp, Instagram, Slack…). These apps don't run the app's
         JavaScript; they read these tags. %SITE_URL% is filled in at build time by
         scripts/set-site-url.mjs, because the image address must be a full https:// URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlyTag" />
    <meta property="og:title" content="FlyTag · Rides to SAN with UCSD classmates" />
    <meta property="og:description" content="Tag along with fellow classmates to and from the airport. Split the fare and chat with your ride." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FlyTag: a plane over a blue sky, with the words Tag along with fellow classmates to and from the airport." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlyTag · Rides to SAN with UCSD classmates" />
    <meta name="twitter:description" content="Tag along with fellow classmates to and from the airport." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- The `react-native-web` recommended style reset (from Expo's default template). -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
